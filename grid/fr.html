<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            display: grid;
            width: 1500px;
            height: 535px;
            text-align: center;
            margin: auto;
            grid-template-columns: 1fr 2fr 2fr;
            grid-template-rows: 80px 405px;
        }
        .header{
            grid-column-start: 1;
            grid-column-end: 4;
            height: 150px;
            width: 1500px;
        }
        .menu{
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 2;
            grid-row-end: 3;
            height: 600px;
        }
        .main{
            grid-column-start: 2;
            grid-column-end: 4;
            grid-row-start: 2;
            grid-row-end: 3;
            height: 600px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header" style="background-color: red;">Header</div>
        <div class="menu" style="background-color: green;">Menu</div>
        <div class="main" style="background-color: blue;">Main</div>
    </div>
</body>
</html>
