<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            background-color: black;
        }
        h2{
            color: wheat;
        }
    .flex-containerA{
        display:flex;
        flex-direction: row;
        justify-content: space-around;
    }
    .flex-containerB{
        display: block;
    }
    .flex-containerC{
        display: inline-flex;
    }
    div{
        background-color: turquoise;
        margin:10px;
        padding: 15px;
        border: 2px dashed blue;
    }
    </style>
</head>
<body>
    <h2>FlexBox Example</h2>
    <div class="flex-containerA">
        <div>Item-A</div>
        <div > Item-B</div>
        <div >Item-C</div>
    </div>
    <div class="flex-containerB">
        <div >Item-A</div>
        <div>Item-B</div>
        <div >Item-C</div>
    </div>
    <div class="flex-containerC">
        <div >Item-A</div>
        <div>Item-B</div>
        <div>Item-C</div>
    </div>
</body>
</html>
