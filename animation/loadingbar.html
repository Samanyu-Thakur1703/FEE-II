<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 400px;
            height: auto;
            border: 2px solid navy;
        }
        .square{
    width: 20px;           
    height: 20px;
    background-color: rgba(16, 117, 0, 0.927);
    animation: mymoves 5s forwards;
}

@keyframes mymoves{
    0%{
        width: 20px;
    }
    25%{
        width: 100px;
    }
    50%{
        width: 200px;
    }
    75%{
        width: 300px;
    }
    100%{
        width: 400px;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="square"></div>
    </div>
    <div class="load">Loading...</div>
</body>
</html>
