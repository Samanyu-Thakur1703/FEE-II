<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: #0b141a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* ----- LAYOUT ----- */
    .app {
      display: flex;
      width: 100vw;
      height: 100vh;
      max-width: 1600px;
    }

    /* ----- SIDEBAR ----- */
    .sidebar {
      width: 420px;
      min-width: 340px;
      background: #111b21;
      border-right: 1px solid #313d45;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      background: #202c33;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 60px;
    }
    .sidebar-header .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #6a7175;
      overflow: hidden;
      cursor: pointer;
    }
    .sidebar-header .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .sidebar-header .icons {
      display: flex;
      gap: 24px;
      color: #aebac1;
      font-size: 18px;
    }
    .sidebar-header .icons i {
      cursor: pointer;
      padding: 4px;
    }
    .sidebar-header .icons i:hover {
      color: #e9edef;
    }

    /* ----- SEARCH BAR ----- */
    .search-bar {
      padding: 8px 12px;
      background: #111b21;
    }
    .search-bar .search-inner {
      display: flex;
      align-items: center;
      background: #202c33;
      border-radius: 8px;
      padding: 0 12px;
      gap: 12px;
    }
    .search-bar .search-inner i {
      color: #8696a0;
      font-size: 14px;
    }
    .search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e9edef;
      font-size: 14px;
      padding: 9px 0;
    }
    .search-bar input::placeholder {
      color: #8696a0;
    }
    .search-bar .filter-btn {
      color: #8696a0;
      font-size: 16px;
      cursor: pointer;
      padding: 8px 0;
    }
    .search-bar .filter-btn:hover {
      color: #e9edef;
    }

    /* ----- CHAT LIST (SCROLLABLE) ----- */
    .chat-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .chat-list::-webkit-scrollbar {
      width: 6px;
    }
    .chat-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-list::-webkit-scrollbar-thumb {
      background: #374045;
      border-radius: 3px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 14px;
      cursor: pointer;
      border-bottom: 1px solid #1f2c33;
      transition: background 0.1s;
    }
    .chat-item:hover {
      background: #202c33;
    }
    .chat-item.active {
      background: #2a3942;
    }
    .chat-item .chat-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
    }
    .chat-item .chat-info {
      flex: 1;
      min-width: 0;
    }
    .chat-item .chat-info .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .chat-item .chat-info .top-row .name {
      font-size: 16px;
      font-weight: 400;
      color: #e9edef;
    }
    .chat-item .chat-info .top-row .time {
      font-size: 12px;
      color: #8696a0;
      flex-shrink: 0;
      margin-left: 8px;
    }
    .chat-item .chat-info .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-item .chat-info .bottom-row .last-msg {
      font-size: 13.5px;
      color: #8696a0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-item .chat-info .bottom-row .last-msg .pinned {
      color: #8696a0;
      margin-right: 4px;
      font-size: 12px;
    }
    .chat-item .chat-info .bottom-row .last-msg .tick {
      margin-right: 4px;
      font-size: 12px;
    }
    .chat-item .meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }
    .chat-item .meta .unread {
      background: #00a884;
      color: #111b21;
      font-size: 11px;
      font-weight: 600;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }
    .chat-item .meta .pinned-icon {
      color: #8696a0;
      font-size: 14px;
    }

    /* ----- MAIN PANEL ----- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0b141a;
      min-width: 0;
    }

    .main-header {
      background: #202c33;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 60px;
    }
    .main-header .back-btn {
      display: none;
      color: #aebac1;
      font-size: 20px;
      cursor: pointer;
    }
    .main-header .contact-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
    }
    .main-header .contact-info {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }
    .main-header .contact-info .contact-name {
      font-size: 16px;
      font-weight: 500;
      color: #e9edef;
    }
    .main-header .contact-info .contact-status {
      font-size: 12px;
      color: #8696a0;
    }
    .main-header .header-icons {
      display: flex;
      gap: 22px;
      color: #aebac1;
      font-size: 18px;
    }
    .main-header .header-icons i {
      cursor: pointer;
    }
    .main-header .header-icons i:hover {
      color: #e9edef;
    }

    /* ----- MESSAGE AREA (SCROLLABLE) ----- */
    .message-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 60px;
      background:
        radial-gradient(circle at 20% 30%, rgba(0, 168, 132, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0, 168, 132, 0.03) 0%, transparent 50%),
        #0b141a;
      display: flex;
      flex-direction: column;
    }
    .message-area::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" opacity="0.03"><path d="M24 0L48 24L24 48L0 24Z" fill="none"/><circle cx="24" cy="24" r="18" fill="none" stroke="%2300a884" stroke-width="0.5"/></svg>');
      background-size: 120px 120px;
      pointer-events: none;
      z-index: 0;
    }
    .message-area::-webkit-scrollbar {
      width: 6px;
    }
    .message-area::-webkit-scrollbar-track {
      background: transparent;
    }
    .message-area::-webkit-scrollbar-thumb {
      background: #374045;
      border-radius: 3px;
    }

    .messages-container {
      position: relative;
      z-index: 1;
      margin-top: auto;
      display: flex;
      flex-direction: column;
    }

    /* ----- DATE DIVIDER ----- */
    .date-divider {
      text-align: center;
      margin: 10px 0;
    }
    .date-divider span {
      background: #182229;
      color: #8696a0;
      font-size: 12.5px;
      padding: 6px 12px;
      border-radius: 8px;
      box-shadow: 0 1px 1px rgba(0,0,0,0.3);
    }

    /* ----- MESSAGE BUBBLES ----- */
    .message {
      max-width: 65%;
      margin-bottom: 4px;
      display: flex;
      flex-direction: column;
      position: relative;
      animation: msgIn 0.15s ease-out;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.received {
      align-self: flex-start;
    }
    .message.sent {
      align-self: flex-end;
    }

    .message .bubble {
      padding: 8px 10px 6px 10px;
      border-radius: 8px;
      font-size: 14.5px;
      line-height: 1.45;
      position: relative;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.received .bubble {
      background: #202c33;
      color: #e9edef;
      border-top-left-radius: 0;
      box-shadow: 0 1px 1px rgba(0,0,0,0.3);
    }
    .message.received:first-of-type .bubble {
      border-top-left-radius: 8px;
    }
    .message.received .bubble::before {
      content: '';
      position: absolute;
      top: 0;
      left: -8px;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 0 8px 8px;
      border-color: transparent transparent #202c33 transparent;
    }
    .message.received:first-of-type .bubble::before {
      display: block;
    }
    .message.received + .message.received .bubble::before {
      display: none;
    }

    .message.sent .bubble {
      background: #005c4b;
      color: #e9edef;
      border-top-right-radius: 0;
      box-shadow: 0 1px 1px rgba(0,0,0,0.3);
    }
    .message.sent:first-of-type .bubble {
      border-top-right-radius: 8px;
    }
    .message.sent .bubble::before {
      content: '';
      position: absolute;
      top: 0;
      right: -8px;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 8px 8px 0;
      border-color: transparent #005c4b transparent transparent;
    }
    .message.sent:first-of-type .bubble::before {
      display: block;
    }
    .message.sent + .message.sent .bubble::before {
      display: none;
    }

    .message .bubble .msg-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 2px;
    }
    .message .bubble .msg-footer .msg-time {
      font-size: 11px;
      color: rgba(233, 237, 239, 0.6);
    }
    .message.sent .bubble .msg-footer .msg-time {
      color: rgba(233, 237, 239, 0.7);
    }
    .message .bubble .msg-footer .msg-tick {
      font-size: 14px;
    }
    .message.sent .bubble .msg-footer .msg-tick {
      color: #53bdeb;
    }

    /* ----- TYPING INDICATOR ----- */
    .message.typing .bubble {
      background: #202c33;
      color: #e9edef;
      padding: 14px 16px;
      border-top-left-radius: 0;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .message.typing .bubble::before {
      content: '';
      position: absolute;
      top: 0;
      left: -8px;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 0 8px 8px;
      border-color: transparent transparent #202c33 transparent;
    }
    .typing-dots {
      display: flex;
      gap: 4px;
    }
    .typing-dots span {
      width: 8px;
      height: 8px;
      background: #8696a0;
      border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ----- INPUT AREA ----- */
    .input-area {
      background: #202c33;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 62px;
    }
    .input-area .emoji-btn,
    .input-area .attach-btn {
      color: #8696a0;
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
    }
    .input-area .emoji-btn:hover,
    .input-area .attach-btn:hover {
      color: #e9edef;
    }
    .input-area .input-wrapper {
      flex: 1;
      background: #2a3942;
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 12px;
    }
    .input-area .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e9edef;
      font-size: 15px;
      padding: 10px 0;
    }
    .input-area .input-wrapper input::placeholder {
      color: #8696a0;
    }
    .input-area .mic-btn {
      color: #8696a0;
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
    }
    .input-area .mic-btn:hover {
      color: #e9edef;
    }

    /* ----- AVATAR COLORS ----- */
    .avatar-green { background: #00a884; }
    .avatar-blue { background: #5b61b9; }
    .avatar-orange { background: #df6c4f; }
    .avatar-purple { background: #9b59b6; }
    .avatar-teal { background: #1abc9c; }
    .avatar-red { background: #e74c3c; }
    .avatar-pink { background: #d63384; }
    .avatar-indigo { background: #4f46e5; }
    .avatar-amber { background: #d97706; }
    .avatar-cyan { background: #06b6d4; }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 900px) {
      .sidebar { width: 100%; min-width: 0; }
      .main { display: none; }
      .main.show { display: flex; width: 100%; }
      .sidebar.hide { display: none; }
      .main-header .back-btn { display: block; }
      .message-area { padding: 20px 20px; }
    }
    @media (max-width: 600px) {
      .message-area { padding: 12px 12px; }
      .message { max-width: 85%; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">

    <!-- Header -->
    <div class="sidebar-header">
      <div class="avatar avatar-green">
        <svg viewBox="0 0 40 40" width="40" height="40"><circle cx="20" cy="20" r="20" fill="#00a884"/><text x="20" y="25" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">M</text></svg>
      </div>
      <div class="icons">
        <i class="fa-solid fa-rotate-left" title="Status"></i>
        <i class="fa-regular fa-message" title="New chat"></i>
        <i class="fa-solid fa-bars" title="Menu"></i>
      </div>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <div class="search-inner">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search or start new chat">
        <i class="fa-solid fa-sliders filter-btn"></i>
      </div>
    </div>

    <!-- Chat List (scrollable) -->
    <div class="chat-list" id="chatList"></div>
  </aside>

  <!-- ===== MAIN PANEL ===== -->
  <main class="main" id="mainPanel">

    <!-- Chat Header -->
    <div class="main-header">
      <i class="fa-solid fa-arrow-left back-btn" id="backBtn"></i>
      <div class="contact-avatar" id="activeAvatar">A</div>
      <div class="contact-info">
        <div class="contact-name" id="activeName">Aria Chen</div>
        <div class="contact-status" id="activeStatus">online</div>
      </div>
      <div class="header-icons">
        <i class="fa-solid fa-magnifying-glass" title="Search"></i>
        <i class="fa-solid fa-phone" title="Call"></i>
        <i class="fa-solid fa-ellipsis-vertical" title="Menu"></i>
      </div>
    </div>

    <!-- Messages (scrollable) -->
    <div class="message-area" id="messageArea">
      <div class="messages-container" id="messagesContainer"></div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <i class="fa-regular fa-face-smile emoji-btn"></i>
      <i class="fa-solid fa-paperclip attach-btn"></i>
      <div class="input-wrapper">
        <input type="text" placeholder="Type a message" id="msgInput">
      </div>
      <i class="fa-solid fa-microphone mic-btn"></i>
    </div>
  </main>
</div>

<script>
  // ===== CONTACT DATA (10 chats) =====
  const contacts = [
    { id: 0, name: 'Aria Chen', avatar: 'A', color: 'avatar-green', status: 'online', lastMsg: 'Sounds great! Let me know when you\'re free 🙌', time: '12:45', unread: 3, pinned: false },
    { id: 1, name: 'Marcus Johnson', avatar: 'M', color: 'avatar-blue', status: 'typing...', lastMsg: 'I\'ll send you the docs by EOD', time: '11:30', unread: 0, pinned: true },
    { id: 2, name: 'Priya Sharma', avatar: 'P', color: 'avatar-orange', status: 'last seen today at 10:15 AM', lastMsg: 'The design looks amazing! 🎨', time: '10:20', unread: 0, pinned: false },
    { id: 3, name: 'Elena Rodriguez', avatar: 'E', color: 'avatar-purple', status: 'last seen yesterday', lastMsg: 'Can you review my PR?', time: 'Yesterday', unread: 5, pinned: false },
    { id: 4, name: 'David Kim', avatar: 'D', color: 'avatar-teal', status: 'online', lastMsg: 'Perfect, see you at 3pm', time: 'Yesterday', unread: 0, pinned: false },
    { id: 5, name: 'Sarah Mitchell', avatar: 'S', color: 'avatar-red', status: 'last seen 2 hours ago', lastMsg: 'Thanks for the help! 😊', time: 'Yesterday', unread: 0, pinned: false },
    { id: 6, name: 'Ravi Patel', avatar: 'R', color: 'avatar-pink', status: 'online', lastMsg: 'Done ✅', time: 'Tue', unread: 1, pinned: false },
    { id: 7, name: 'Jessica Wu', avatar: 'J', color: 'avatar-indigo', status: 'last seen 3 days ago', lastMsg: 'Happy Birthday!! 🎂🎉', time: 'Mon', unread: 0, pinned: false },
    { id: 8, name: 'Tomás García', avatar: 'T', color: 'avatar-amber', status: 'last seen this week', lastMsg: 'Sure, I\'ll take a look', time: 'Sun', unread: 0, pinned: false },
    { id: 9, name: 'Zara Khan', avatar: 'Z', color: 'avatar-cyan', status: 'last seen recently', lastMsg: 'The presentation is ready', time: 'Sat', unread: 2, pinned: false },
  ];

  // ===== MESSAGE DATA =====
  const messages = [
    { type: 'divider', text: 'Friday, December 20' },
    { type: 'received', text: 'Hey! Are you free this weekend?', time: '10:30 AM' },
    { type: 'sent', text: 'Yeah, mostly! What\'s up?', time: '10:32 AM', read: true },
    { type: 'received', text: 'Was thinking we could catch that new sci-fi movie everyone\'s talking about. The one with the time loops.', time: '10:33 AM' },
    { type: 'sent', text: 'Ohh Dark Horizon? I\'ve heard it\'s incredible. The cinematography is supposed to be mind-blowing.', time: '10:35 AM', read: true },
    { type: 'received', text: 'Yes exactly! Want to go tomorrow evening?', time: '10:36 AM' },
    { type: 'sent', text: 'Can\'t do tomorrow, got a family dinner. How about Sunday afternoon?', time: '10:38 AM', read: true },
    { type: 'received', text: 'Sunday works! Let\'s do the 4pm show', time: '10:40 AM' },

    { type: 'divider', text: 'Saturday, December 21' },
    { type: 'received', text: 'Hey! I\'m at the mall right now and saw something you\'d love', time: '2:15 PM' },
    { type: 'received', text: 'That limited edition vinyl you wanted is here! Only 3 left though 🫣', time: '2:16 PM' },
    { type: 'sent', text: 'WHAT. NO WAY. Grab it for me please!!', time: '2:18 PM', read: true },
    { type: 'sent', text: 'I\'ll transfer the money right now', time: '2:18 PM', read: true },
    { type: 'received', text: 'Already got it in my hands 😎 No rush on the money', time: '2:20 PM' },
    { type: 'sent', text: 'You\'re a legend! 🐐', time: '2:22 PM', read: true },

    { type: 'divider', text: 'Monday, December 23' },
    { type: 'received', text: 'Movie\'s in 2 hours! You still on?', time: '1:45 PM' },
    { type: 'sent', text: '100%! Just leaving the house now. Should be there in 30.', time: '1:47 PM', read: true },
    { type: 'received', text: 'Perfect, I\'ll grab the tickets', time: '1:48 PM' },

    { type: 'divider', text: 'Today' },
    { type: 'received', text: 'That movie was INSANE. Still thinking about the ending 🤯', time: '9:15 AM' },
    { type: 'sent', text: 'Right?? The part where she realizes she\'s been looping too — chills!', time: '9:18 AM', read: true },
    { type: 'received', text: 'We need to watch the sequel when it comes out. Want to make it a tradition?', time: '9:20 AM' },
    { type: 'sent', text: 'Absolutely! Movie buddies forever 🍿', time: '9:22 AM', read: true },
    { type: 'received', text: 'Sounds great! Let me know when you\'re free 🙌', time: '12:45 PM' },
  ];

  // ===== RENDER CHAT LIST =====
  function renderChats() {
    const container = document.getElementById('chatList');
    container.innerHTML = contacts.map((c, i) => {
      return `
        <div class="chat-item ${i === 0 ? 'active' : ''}" data-id="${i}" onclick="selectChat(${i})">
          <div class="chat-avatar ${c.color}">${c.avatar}</div>
          <div class="chat-info">
            <div class="top-row">
              <span class="name">${c.name}</span>
              <span class="time">${c.time}</span>
            </div>
            <div class="bottom-row">
              <span class="last-msg">
                ${c.pinned ? '<i class="fa-solid fa-thumbtack pinned"></i>' : ''}
                ${c.lastMsg}
              </span>
            </div>
          </div>
          <div class="meta">
            ${c.unread > 0 ? `<span class="unread">${c.unread}</span>` : ''}
            ${c.pinned ? '<i class="fa-solid fa-thumbtack pinned-icon"></i>' : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  // ===== RENDER MESSAGES =====
  let currentChat = 0;

  function renderMessages() {
    const container = document.getElementById('messagesContainer');
    container.innerHTML = messages.map(m => {
      if (m.type === 'divider') {
        return `<div class="date-divider"><span>${m.text}</span></div>`;
      }
      const cls = m.type === 'sent' ? 'sent' : 'received';
      const tickHtml = m.type === 'sent'
        ? `<span class="msg-tick"><i class="fa-solid fa-check-double"></i></span>`
        : '';
      return `
        <div class="message ${cls}">
          <div class="bubble">
            ${m.text}
            <div class="msg-footer">
              <span class="msg-time">${m.time}</span>
              ${tickHtml}
            </div>
          </div>
        </div>
      `;
    }).join('');
    // Auto-scroll to bottom
    const area = document.getElementById('messageArea');
    requestAnimationFrame(() => { area.scrollTop = area.scrollHeight; });
  }

  // ===== SELECT CHAT =====
  function selectChat(id) {
    currentChat = id;
    const c = contacts[id];
    document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`.chat-item[data-id="${id}"]`).classList.add('active');
    document.getElementById('activeAvatar').className = `contact-avatar ${c.color}`;
    document.getElementById('activeAvatar').textContent = c.avatar;
    document.getElementById('activeName').textContent = c.name;
    document.getElementById('activeStatus').textContent = c.status;
    // Mobile: switch to main panel
    document.getElementById('sidebar').classList.add('hide');
    document.getElementById('mainPanel').classList.add('show');
    // Clear unread badge
    c.unread = 0;
    renderChats();
    renderMessages();
  }

  // ===== SEND MESSAGE ON ENTER =====
  document.getElementById('msgInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && this.value.trim()) {
      const text = this.value.trim();
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      messages.push({ type: 'sent', text, time: timeStr, read: false });
      this.value = '';
      renderMessages();
      contacts[currentChat].lastMsg = text;
      contacts[currentChat].time = timeStr;
      renderChats();
    }
  });

  // ===== MOBILE BACK BUTTON =====
  document.getElementById('backBtn').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('hide');
    document.getElementById('mainPanel').classList.remove('show');
  });

  // ===== INIT =====
  renderChats();
  renderMessages();
  const first = contacts[0];
  document.getElementById('activeAvatar').className = `contact-avatar ${first.color}`;
  document.getElementById('activeAvatar').textContent = first.avatar;
  document.getElementById('activeName').textContent = first.name;
  document.getElementById('activeStatus').textContent = first.status;
</script>
</body>
</html>
