<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            position: fixed;
        }
        .sq1{
            background-color: red;
            border: 1px solid black;
            top: 50px;
            left:50px;
            z-index: 1;
        }
        .sq2{
            background-color: rgb(0, 47, 255);
            border: 1px solid black;
            top: 100px;
            left:100px;
            opacity: .5;
            z-index: 2;
        }
        .sq3{
            background-color: rgb(0, 255, 76);
            border: 1px solid black;
            top: 150px;
            left:150px;
            opacity: .5;
        }

    </style>
</head>
<body>
    <div class="sq1"></div>
    <div class="sq2"></div>
    <div class="sq3"></div>
</body>
</html>
