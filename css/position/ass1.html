<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#90ff90;
    font-family:Times New Roman;
}

/* Fixed navbar */
.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#2eeaea;
    border:2px solid green;
    z-index:1000;
}

.navbar a{
    float:left;
    width:20%;
    text-align:center;
    text-decoration:none;
    padding:10px;
    border:1px solid #007777;
    color:black;
    background:#2eeaea;
}

/* Layout */
.container{
    display:flex;
    margin-top:60px;
}

/* Main content */
.main{
    width:80%;
    padding:20px;
}

.space{
    height:350px;
}

/* Sticky sidebar */
.sidebar{
    width:20%;
    background:#7df57d;
    border-left:2px solid green;
    padding:20px;

    position:sticky;
    top:55px;   /* navbar height */
    height:250px;
}

.sidebar h3{
    margin-bottom:20px;
}

.sidebar p{
    margin:25px 0;
}</style>
</head>
<body>
    

    <div class="navbar">
        <a href="#">About</a>
        <a href="#">Home</a>
        <a href="#">Contact Us</a>
        <a href="#">Login</a>
        <a href="#">Logout</a>
    </div>

    <div class="container">

        <div class="main">
            <h2>Services</h2>

            <div class="space"></div>

            <h2>Offers</h2>

            <div class="space"></div>

            <h2>Clients</h2>

            <div class="space"></div>
        </div>

        <div class="sidebar">
            <h3>Quick Links</h3>
            <p>Products</p>
            <p>Gallery</p>
            <p>Contact</p>
        </div>

    </div>


</body>
</html>
