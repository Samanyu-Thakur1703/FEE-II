<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shape </title>
  <style>
    .box {
      width: 100px;
      height: 100px;
      border: 2px solid black;
      margin: 20px auto;
      transition: all 1s ease; 
    }
    label {
      margin: 5px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>Shapes</h2>
  <div class="box" id="box"></div>

  <input type="radio" name="effect" id="circle">
  <label for="circle">Circle</label>

  <input type="radio" name="effect" id="square" checked>
  <label for="square">Square</label>

  <input type="radio" name="effect" id="rectangle">
  <label for="rectangle">Rectangle</label>

  <input type="radio" name="effect" id="fillYellow">
  <label for="fillYellow">Fill Yellow</label>

  <input type="radio" name="effect" id="fillNone">
  <label for="fillNone">Fill None</label>

  

  <script>
    const box = document.getElementById("box");
    const radios = document.querySelectorAll("input[name='effect']");

    radios.forEach(radio => {
      radio.addEventListener("change", () => {
        switch(radio.id) {
          case "circle":
            box.style.width = "100px";
            box.style.height = "100px";
            box.style.borderRadius = "50%";
            break;
          case "square":
            box.style.width = "100px";
            box.style.height = "100px";
            box.style.borderRadius = "0";
            break;
          case "rectangle":
            box.style.width = "150px";
            box.style.height = "100px";
            box.style.borderRadius = "0";
            break;
          case "fillYellow":
            box.style.backgroundColor = "yellow";
            break;
          case "fillNone":
            box.style.backgroundColor = "transparent";
            break;
        }
      });
    });
  </script>
</body>
</html>
