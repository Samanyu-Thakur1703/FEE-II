<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Zoom</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .container {
            text-align: center;
        }

        .buttons {
            margin: 20px 0;
        }

        button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .image-box {
            width: min(90vw, 700px);
            height: min(65vh, 500px);
            overflow: hidden;
            background-color: #222;
        }

        .zoomable {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease-in-out;
        }

        @media (max-width: 500px) {
            button {
                margin: 0 4px;
                padding: 9px 14px;
            }

            .image-box {
                height: 55vh;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="content">
            <div class="buttons">
                <button id="zoomIn">Zoom In</button>
                <button id="zoomOut">Zoom Out</button>
            </div>

            <div class="image-box">
                <img class="zoomable" id="zoomable" src="https://picsum.photos/id/1018/1000/600" alt="Mountain landscape">
            </div>
        </div>
    </div>
    
    <script>
let curscale = 0.5;

function zoomin() {
    if (curscale >= 3)
        alert("You are fully zoomed!");
    else {
        document.getElementById("img1").style.scale = curscale + 1;
        document.getElementById("img1").style.transition = "0.5s";
        curscale++;
    }
}

function zoomout() {
    if (curscale < 1)
        alert("Limit Reached!");
    else {
        document.getElementById("img1").style.scale = curscale - 0.5;
        document.getElementById("img1").style.transition = "0.5s";
        curscale--;
    }
}
</script>

</body>
</html>
