<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Tag</title>
</head>
<body>
    <h2>Computer Devices-</h2>

    <ol type = "I">
        <li>Input Devices</li>
        <ul type="disc">
            <li>Keyboard</li>
            <li>Mouse</li>
            <li>Scanner</li>
        </ul>
        <li>Output Devices</li>
        <ul type="square">
            <li>Monitor</li>
            <li>Speaker</li>
        </ul>
        <li>Storage devices</li>
        <ul type="circle">
            <li>Hard disk</li>
            <li>USB</li>
            <LI>DVD</LI>
        </ul>
    </ol>
</body>
</html>
